name: Finalize v0.1.0 GitHub Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      TAG: v0.1.0
      VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Verify v0.1.0 package versions
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/redis packages/cloudflare; do
            actual="$(node -p "require('./${dir}/package.json').version")"
            test "$actual" = "$VERSION"
          done

      - name: Run Cloudflare workerd integration
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.114.0 dev --local \
            --config packages/cloudflare/wrangler.test.jsonc \
            --port 8799 >/tmp/muc-cloudflare-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; cat /tmp/muc-cloudflare-wrangler.log || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -sS http://127.0.0.1:8799/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          node packages/cloudflare/test/integration.mjs
          node packages/cloudflare/test/reconciliation.mjs
          node packages/cloudflare/test/maintenance.mjs

      - name: Pack and inspect v0.1.0 artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          for dir in core mcp redis cloudflare; do
            (cd "packages/$dir" && npm pack --pack-destination /tmp/muc-packs)
          done
          git diff --exit-code -- \
            packages/core/package.json \
            packages/mcp/package.json \
            packages/redis/package.json \
            packages/cloudflare/package.json
          test "$(find /tmp/muc-packs -name '*.tgz' | wc -l)" -eq 4
          for archive in /tmp/muc-packs/*.tgz; do
            manifest="$(tar -xOf "$archive" package/package.json)"
            ! grep -q 'workspace:' <<<"$manifest"
            ! grep -q 'pack-workspace-deps' <<<"$manifest"
          done

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Move unfinished tag to this tested commit and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_target="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$current_target" != "$GITHUB_SHA" ]]; then
              echo "refusing to move $TAG because a GitHub Release already exists" >&2
              exit 1
            fi
            echo "$TAG is already released at this commit"
            exit 0
          fi

          if [[ "$current_target" != "$GITHUB_SHA" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
