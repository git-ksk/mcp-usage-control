name: Apply Cloudflare source fixups

on:
  push:
    branches: [feat/cloudflare-durable-objects]
    paths:
      - '.github/workflows/fix-cloudflare-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cloudflare-durable-objects
      - name: Apply deterministic source fixups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/cloudflare/src/index.ts')
          text = path.read_text()
          old = """    const prepared = await prepareReserve(input, {\n      domainName: 'remote',\n      cleanupBatchSize: 1,\n      idempotencyTtlMs: 1,\n    });"""
          new = """    const prepared = await prepareReserve(input, {\n      cleanupBatchSize: 1,\n      idempotencyTtlMs: 1,\n    });"""
          if old not in text:
              raise SystemExit('expected source block not found')
          path.write_text(text.replace(old, new))
          PY
          cp packages/core/LICENSE packages/cloudflare/LICENSE
      - name: Commit fixups
        shell: bash
        run: |
          set -euo pipefail
          git config user.name git-ksk
          git config user.email 108925270+git-ksk@users.noreply.github.com
          git add packages/cloudflare/src/index.ts packages/cloudflare/LICENSE
          git commit -m "fix(cloudflare): correct remote reserve preparation and add license"
          git push origin HEAD:feat/cloudflare-durable-objects
