name: One-shot npm publication docs closeout

on:
  push:
    branches:
      - docs/npm-v1-published-v4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: docs/npm-v1-published-v4
          fetch-depth: 0
      - run: python scripts/npm-publication-docs-closeout.py
      - run: rm scripts/npm-publication-docs-closeout.py
      - name: Commit docs closeout
        run: |
          git config user.name git-ksk
          git config user.email 108925270+git-ksk@users.noreply.github.com
          git add README.md README.ja.md docs/v1-readiness.md docs/v1-readiness.ja.md scripts/npm-publication-docs-closeout.py
          git commit -m "docs: mark npm v1.0.0 publication complete"
          git push origin HEAD:docs/npm-v1-published-v4
