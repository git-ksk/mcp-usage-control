name: Update Cloudflare workspace lock

on:
  push:
    branches: [feat/cloudflare-durable-objects]
    paths:
      - '.github/workflows/update-cloudflare-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cloudflare-durable-objects
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --lockfile-only
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name git-ksk
          git config user.email 108925270+git-ksk@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: update lockfile for Cloudflare adapter"
          git push origin HEAD:feat/cloudflare-durable-objects
