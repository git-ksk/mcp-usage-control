name: Fix Firestore client types

on:
  push:
    branches:
      - feat/firestore-usage-store
    paths:
      - '.github/workflows/fix-firestore-client-types.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/firestore-usage-store
      - name: Apply client type fix
        run: python3 .github/scripts/fix_firestore_client_types.py
      - name: Commit client type fix
        run: |
          rm .github/workflows/fix-firestore-client-types.yml
          rm .github/scripts/fix_firestore_client_types.py
          git config user.name 'git-ksk'
          git config user.email '108925270+git-ksk@users.noreply.github.com'
          git add packages/firestore/src/index.ts packages/firestore/src/index.test.ts .github/workflows/fix-firestore-client-types.yml .github/scripts/fix_firestore_client_types.py
          git diff --cached --check
          git commit -m 'fix: accept official Firestore server client types'
          git push origin HEAD:feat/firestore-usage-store
