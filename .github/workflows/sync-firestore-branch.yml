name: Sync Firestore branch with main

on:
  push:
    branches:
      - feat/firestore-usage-store
    paths:
      - '.github/workflows/sync-firestore-branch.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/firestore-usage-store
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'git-ksk'
          git config user.email '108925270+git-ksk@users.noreply.github.com'
          git fetch origin main
          git rm .github/workflows/sync-firestore-branch.yml
          git commit -m 'chore: remove temporary branch sync workflow'
          git merge --no-edit origin/main
          git push origin HEAD:feat/firestore-usage-store
