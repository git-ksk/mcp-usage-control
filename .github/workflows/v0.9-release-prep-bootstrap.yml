name: v0.9 release prep bootstrap

on:
  push:
    branches:
      - release/v0.9.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.9.0

      - name: Prepare v0.9.0 release files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          for path in [
              'packages/core/package.json',
              'packages/mcp/package.json',
              'packages/redis/package.json',
              'packages/cloudflare/package.json',
              'packages/firestore/package.json',
          ]:
              replace_once(path, '"version": "0.8.0"', '"version": "0.9.0"')

          changelog_en = '''## [0.9.0] - 2026-08-22

Ninth GitHub/source release preparation, focused on repository-wide safety hardening. This preparation does not itself create the tag, GitHub Release, or npm publication; those remain post-merge release operations.

### Safety hardening

- Closed the v0.9 repository-audit safety set #116-#127, covering retained-budget growth integrity, safe expiry/timer arithmetic, validation before mutation, unresolved MCP growth preservation, Firestore expired-liable reconciliation, Cloudflare remote/maintenance protocol validation, malformed policy fail-closed behavior, vector maintenance quota integrity, Redis recovery overflow, pre-auth reconciliation buffering, strict boolean authorization, and the cross-capability regression matrix.
- Preserved the existing scalar/vector accounting, replay, liability, expiry/recovery, and fail-closed contracts while tightening provider and capability intersections rather than adding a new product surface.

### Firestore release blocker

- Resolved #143 without weakening `vector-growth-vs-settle-race`: settlement remains required to complete, and a committed growth must be observed by settlement when growth wins first.
- Added bounded jittered outer retry only for definitive Firestore transaction aborts: gRPC `ABORTED` (`10`) and HTTP `409`.
- `UNKNOWN`, `UNAVAILABLE`, `INVALID_ARGUMENT`, and other ambiguous/provider failures are not added to the adapter outer-retry allow-list.
- Reduced the vector-settlement contention window by skipping budget reads/writes when settlement releases no capacity, and added a dedicated 24-iteration Firestore Emulator growth-vs-settle stress case.

### Release evidence / boundary

- PR #144 passed the Node 20/22/24 CI/package matrix, Cloudflare local workerd integration, and Firestore Emulator integration before squash merge.
- All five public package manifests are aligned at `0.9.0` for release preparation.
- After this preparation merges and the normal release gate is green, the exact tested main content is eligible for the `v0.9.0` tag and GitHub Release.
- First npm publication is separately and explicitly authorized for this v0.9 release execution; publication remains a distinct post-source-release operation and #6 closes only after registry/provenance verification succeeds.

'''
          replace_once(
              'CHANGELOG.md',
              '## [Unreleased]\n\nNo entries yet.\n\n',
              '## [Unreleased]\n\nNo entries yet.\n\n' + changelog_en,
          )

          changelog_ja = '''## [0.9.0] - 2026-08-22

9回目のGitHub/source release preparation。repository全体のsafety hardeningを主対象とします。このpreparation自体ではtag / GitHub Release / npm publicationを作成せず、main merge後のrelease操作として分離します。

### Safety hardening

- v0.9 repository auditの#116〜#127をclose。retained-budget growth integrity、安全なexpiry/timer arithmetic、mutation前validation、MCP unresolved growth保持、Firestore expired-liable reconciliation、Cloudflare remote/maintenance protocol validation、malformed policy fail-closed、vector maintenance quota integrity、Redis recovery overflow、pre-auth reconciliation buffering、strict boolean authorization、cross-capability regression matrixを固めました。
- 新しいproduct surfaceを増やさず、既存scalar/vector accounting、replay、liability、expiry/recovery、fail-closed contractを維持したままprovider/capability交差部をhardeningしました。

### Firestore release blocker

- #143をrace invariantを弱めず解消。`vector-growth-vs-settle-race`ではsettlement完了を必須のまま維持し、growthが先にcommitした場合はsettlementがそのgrowthを観測する必要があります。
- adapterのouter retryは、commitしていないことが明確なFirestore transaction abortであるgRPC `ABORTED` (`10`) / HTTP `409`だけに限定し、bounded jitter backoffを追加しました。
- `UNKNOWN` / `UNAVAILABLE` / `INVALID_ARGUMENT`などambiguous/provider failureはouter retry allow-listへ追加していません。
- release容量が0のvector settlementではbudget read/writeを省略してcontention windowを短縮し、Firestore Emulatorへ24 iterationのgrowth-vs-settle専用stressを追加しました。

### Release evidence / boundary

- PR #144はsquash merge前にNode 20/22/24 CI/package matrix、Cloudflare local workerd integration、Firestore Emulator integrationがすべてgreenです。
- 5 public package manifestをrelease preparation向けに`0.9.0`へ揃えます。
- このpreparation merge後、normal release gateがgreenなら、同一main contentを`v0.9.0` tag / GitHub Releaseへ進めます。
- first npm publicationは今回のv0.9 release executionとして別途明示authorization済みです。source releaseとは独立操作のまま維持し、registry / provenance verification成功後にのみ#6をcloseします。

'''
