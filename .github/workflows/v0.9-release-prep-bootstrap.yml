              '**Current release preparation: v0.9.0 / #116〜#127 + #143 — RELEASE GATE READY。release後のactive product decision targetはv0.10.0 / #76 + #82 + #99 operational usability / dogfood diagnosticsです。**',
          )
          text = text.replace(
              '**npm publicationはdeferredのまま別操作です。**',
              '**first npm publicationはv0.9向けに明示authorization済みで、source releaseとは別操作のままregistry verification待ちです。**',
          )
          p.write_text(text)

          Path('.github/workflows/v0.9-release-prep-bootstrap.yml').unlink()

      - name: Validate and commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          versions="$(for f in packages/core/package.json packages/mcp/package.json packages/redis/package.json packages/cloudflare/package.json packages/firestore/package.json; do node -p "require('./$f').version"; done | sort -u)"
          test "$versions" = "0.9.0"
          grep -q '^## \[0.9.0\] - 2026-08-22$' CHANGELOG.md
          grep -q '^## \[0.9.0\] - 2026-08-22$' CHANGELOG.ja.md
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/*/package.json CHANGELOG.md CHANGELOG.ja.md README.md README.ja.md docs/roadmap.md docs/roadmap.ja.md docs/v1-readiness.md docs/v1-readiness.ja.md .github/workflows/v0.9-release-prep-bootstrap.yml
          git commit -m "chore(release): prepare v0.9.0"
          git push origin HEAD:release/v0.9.0
