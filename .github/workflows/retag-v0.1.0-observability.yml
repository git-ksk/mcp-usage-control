name: Align unpublished v0.1.0 tag with observability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retag-v0.1.0-observability.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move unpublished v0.1.0 tag to tested observability commit
        env:
          TARGET: 595c8b2f69884c7ec6cced77fa336c85db7de480
          TAG: v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git cat-file -e "$TARGET^{commit}"
          git tag -f "$TAG" "$TARGET"
          git push --force origin "refs/tags/$TAG"
