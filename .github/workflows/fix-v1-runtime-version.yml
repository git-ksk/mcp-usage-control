name: Fix v1 runtime version

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/v1.0.0
          fetch-depth: 0
      - name: Align exported runtime version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/core/src/operational.ts')
          text = path.read_text()
          old = "export const MCP_USAGE_CONTROL_VERSION = '0.13.0';"
          new = "export const MCP_USAGE_CONTROL_VERSION = '1.0.0';"
          if text.count(old) != 1:
              raise SystemExit('unexpected runtime version constant state')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-v1-runtime-version.yml
          git add packages/core/src/operational.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align exported runtime version with v1.0.0"
          git push origin HEAD:release/v1.0.0
