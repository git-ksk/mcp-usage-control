name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
      run_cloudflare: ${{ steps.scope.outputs.run_cloudflare }}
      run_firestore: ${{ steps.scope.outputs.run_firestore }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Classify release-safety scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "run_cloudflare=true" >> "$GITHUB_OUTPUT"
            echo "run_firestore=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; running all release-safety evidence conservatively."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")
          if (( ${#changed[@]} == 0 )); then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "run_cloudflare=true" >> "$GITHUB_OUTPUT"
            echo "run_firestore=true" >> "$GITHUB_OUTPUT"
            echo "No changed paths detected; running all release-safety evidence conservatively."
            exit 0
          fi

          run_full=false
          run_cloudflare=false
          run_firestore=false

          for path in "${changed[@]}"; do
            case "$path" in
              docs/*|*.md)
                ;;
              *)
                run_full=true
                ;;
            esac

            case "$path" in
              packages/core/*|packages/core/**|packages/cloudflare/*|packages/cloudflare/**|.github/workflows/cloudflare-integration.yml|.github/workflows/ci.yml)
                run_cloudflare=true
                ;;
            esac

            case "$path" in
              packages/core/*|packages/core/**|packages/firestore/*|packages/firestore/**|.github/workflows/firestore-integration.yml|.github/workflows/ci.yml)
                run_firestore=true
                ;;
            esac
          done

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "run_cloudflare=$run_cloudflare" >> "$GITHUB_OUTPUT"
          echo "run_firestore=$run_firestore" >> "$GITHUB_OUTPUT"
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          echo "release-safety scope: full=$run_full cloudflare=$run_cloudflare firestore=$run_firestore"

  docs-only:
    name: docs-only
    needs: changes
    if: needs.changes.outputs.run_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Verify documentation diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          git diff --check "$base" "$GITHUB_SHA"
          echo "Documentation-only diff hygiene satisfied; runtime tests are not required."

  node:
    name: node (${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Classify Node runtime evidence
        run: echo "Node ${{ matrix.node }} is supported v1 runtime evidence."

      - run: pnpm install --frozen-lockfile

      - name: Start Redis
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name muc-redis -p 6379:6379 redis:7-alpine >/dev/null
          for attempt in {1..30}; do
            if docker exec muc-redis redis-cli ping 2>/dev/null | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs muc-redis >&2 || true
          exit 1

      - run: pnpm check

      - name: Verify public package versions are aligned
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./packages/core/package.json').version")"
          for dir in packages/core packages/mcp packages/redis packages/cloudflare packages/firestore; do
            actual="$(node -p "require('./${dir}/package.json').version")"
            test "$actual" = "$expected"
          done

      - name: Verify public package Node support floor
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/redis packages/cloudflare packages/firestore; do
            actual="$(node -p "require('./${dir}/package.json').engines.node")"
            test "$actual" = ">=22"
          done

      - name: Pack public packages with npm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          (cd packages/core && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/mcp && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/redis && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/cloudflare && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/firestore && npm pack --pack-destination /tmp/muc-packs)

      - name: Inspect shipped README hygiene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-readmes
          mkdir -p /tmp/muc-readmes
          for tgz in /tmp/muc-packs/*.tgz; do
            name="$(basename "$tgz" .tgz)"
            mkdir -p "/tmp/muc-readmes/$name"
            tar -xzf "$tgz" -C "/tmp/muc-readmes/$name" package/README.md
          done
          if rg -n 'Node\.js 20\+|mcp-usage-control-(0\.9\.0|cloudflare-0\.4\.0)\.tgz|\.\./\.\./docs/' /tmp/muc-readmes; then
            echo 'Shipped README contains stale runtime, tarball, or repository-relative documentation references.' >&2
            exit 1
          fi
          git diff --exit-code -- \
            packages/core/package.json \
            packages/mcp/package.json \
            packages/redis/package.json \
            packages/cloudflare/package.json \
            packages/firestore/package.json

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/muc-packs -name '*.tgz' | wc -l)" -eq 5
          for archive in /tmp/muc-packs/*.tgz; do
            listing="$(tar -tzf "$archive")"
            grep -qx 'package/dist/index.js' <<<"$listing"
            grep -qx 'package/dist/index.d.ts' <<<"$listing"
            grep -qx 'package/README.md' <<<"$listing"
            grep -qx 'package/LICENSE' <<<"$listing"
            if grep -Eq '^package/(src/|dist/.*(\.test\.|\.integration\.test\.))' <<<"$listing"; then
              echo "source or compiled test files leaked into $archive" >&2
              printf '%s\n' "$listing" >&2
              exit 1
            fi
            manifest="$(tar -xOf "$archive" package/package.json)"
            if grep -q 'workspace:' <<<"$manifest"; then
              echo "workspace protocol leaked into $archive" >&2
              exit 1
            fi
            if grep -q 'pack-workspace-deps' <<<"$manifest"; then
              echo "prepack helper leaked into packed manifest for $archive" >&2
              exit 1
            fi
          done
          version="$(node -p "require('./packages/core/package.json').version")"
          core_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-${version}.tgz")"
          grep -qx 'package/dist/operational.js' <<<"$core_listing"
          grep -qx 'package/dist/operational.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/settlement-outcomes.js' <<<"$core_listing"
          grep -qx 'package/dist/settlement-outcomes.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/thresholds.js' <<<"$core_listing"
          grep -qx 'package/dist/thresholds.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/store-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/store-conformance.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/progressive-store-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/progressive-store-conformance.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/reconciliation-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/reconciliation-conformance.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/vector-store-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/vector-store-conformance.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/weighted-credits.js' <<<"$core_listing"
          grep -qx 'package/dist/weighted-credits.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/windowed-budget-keys.js' <<<"$core_listing"
          grep -qx 'package/dist/windowed-budget-keys.d.ts' <<<"$core_listing"
          mcp_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-mcp-${version}.tgz")"
          grep -qx 'package/dist/flow-store-conformance.js' <<<"$mcp_listing"
          grep -qx 'package/dist/flow-store-conformance.d.ts' <<<"$mcp_listing"
          cloudflare_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-cloudflare-${version}.tgz")"
          grep -qx 'package/dist/worker.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/worker.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/versioned-worker.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation-protocol.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/maintenance.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/maintenance.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/maintenance-protocol.js' <<<"$cloudflare_listing"
          redis_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-redis-${version}.tgz")"
          grep -qx 'package/dist/mcp-flow.js' <<<"$redis_listing"
          grep -qx 'package/dist/mcp-flow.d.ts' <<<"$redis_listing"

      - name: Install tarballs in a clean consumer project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-consumer
          mkdir -p /tmp/muc-consumer
          cd /tmp/muc-consumer
          npm init -y >/dev/null
          version="$(node -p "require('$GITHUB_WORKSPACE/packages/core/package.json').version")"
          npm install \
            /tmp/muc-packs/mcp-usage-control-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-mcp-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-redis-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-cloudflare-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-firestore-${version}.tgz \
            @modelcontextprotocol/server@2.0.0 \
            redis@6.2.0 \
            --ignore-scripts
          node --input-type=module <<'NODE'
          import { MemoryUsageStore, UsageControl } from 'mcp-usage-control';
          import {
            UsageOperationalMonitor,
            createUsageRuntimeIdentity,
            projectScopedQuota,
            projectScopedQuotaWindow,
          } from 'mcp-usage-control/operational';
          import {
            InvalidSettlementOutcomeError,
            normalizeSettlementOutcome,
          } from 'mcp-usage-control/settlement-outcomes';
          import {
            didUsageQuotaThresholdCross,
            evaluateUsageQuotaThreshold,
          } from 'mcp-usage-control/thresholds';
          import {
            assertUsageStoreConformance,
            runOperationReconciliationStoreConformance,
            runProgressiveUsageStoreConformance,
            runVectorUsageStoreConformance,
          } from 'mcp-usage-control/conformance';
          import { FirestoreUsageStore } from 'mcp-usage-control-firestore';
          import { protectTool } from 'mcp-usage-control-mcp';
          import { assertMcpUsageFlowStoreConformance } from 'mcp-usage-control-mcp/conformance';
          import { RedisUsageStore } from 'mcp-usage-control-redis';
          import { RedisMcpUsageFlowStore } from 'mcp-usage-control-redis/mcp-flow';
          import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';
          import {
            createReconciliableCloudflareUsageStoreGateway,
            reconcileRemoteCloudflareOperation,
            reconcileRemoteCloudflareReserve,
          } from 'mcp-usage-control-cloudflare/reconciliation';
          import {
            createCloudflareBudgetMaintenanceGateway,
            pruneRemoteCloudflareHistoricalBudgets,
          } from 'mcp-usage-control-cloudflare/maintenance';
          if (![
            MemoryUsageStore,
            UsageControl,
            UsageOperationalMonitor,
            createUsageRuntimeIdentity,
            projectScopedQuota,
            projectScopedQuotaWindow,
            InvalidSettlementOutcomeError,
            normalizeSettlementOutcome,
            didUsageQuotaThresholdCross,
            evaluateUsageQuotaThreshold,
            assertUsageStoreConformance,
            runOperationReconciliationStoreConformance,
            runProgressiveUsageStoreConformance,
            FirestoreUsageStore,
            protectTool,
            assertMcpUsageFlowStoreConformance,
            RedisUsageStore,
            RedisMcpUsageFlowStore,
            CloudflareUsageStore,
            RemoteCloudflareUsageStore,
            createReconciliableCloudflareUsageStoreGateway,
            reconcileRemoteCloudflareOperation,
            reconcileRemoteCloudflareReserve,
            createCloudflareBudgetMaintenanceGateway,
            pruneRemoteCloudflareHistoricalBudgets,
          ].every(Boolean)) {
            throw new Error('public package import smoke test failed');
          }
          NODE

      - name: Stop Redis
        if: always()
        run: docker rm --force muc-redis >/dev/null 2>&1 || true

  dependency-review:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reject newly introduced high/critical vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  cloudflare:
    needs: changes
    if: needs.changes.outputs.run_cloudflare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run Durable Objects integration against local workerd
        shell: bash
        env:
          MCP_USAGE_CLOUDFLARE_TOKEN: local-integration-token
          MCP_USAGE_CLOUDFLARE_OLD_TOKEN: rotated-out-local-token
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.114.0 dev --local \
            --config packages/cloudflare/wrangler.test.jsonc \
            --port 8799 >/tmp/muc-cloudflare-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; cat /tmp/muc-cloudflare-wrangler.log || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -sS http://127.0.0.1:8799/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'local workerd did not become ready' >&2
            exit 1
          fi

          node packages/cloudflare/test/integration.mjs
          node packages/cloudflare/test/conformance.mjs
          node packages/cloudflare/test/rotation.mjs
          node packages/cloudflare/test/reconciliation.mjs
          node packages/cloudflare/test/maintenance.mjs
          node packages/cloudflare/test/authorization.mjs

  firestore:
    needs: changes
    if: needs.changes.outputs.run_firestore == 'true'
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: demo-muc-firestore
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mcp-usage-control build
      - run: pnpm --filter mcp-usage-control-firestore build
      - name: Type-check server Firestore client compatibility
        shell: bash
        run: |
          set -euo pipefail
          compat_file='packages/firestore/client-compat.mts'
          trap 'rm -f "$compat_file"' EXIT
          cat > "$compat_file" <<'TS'
          import type { Firestore } from '@google-cloud/firestore';
          import { FirestoreUsageStore } from './dist/index.js';

          declare const firestore: Firestore;
          new FirestoreUsageStore(firestore);
          TS
          pnpm exec tsc \
            --noEmit \
            --strict \
            --skipLibCheck \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --types node \
            "$compat_file"
      - name: Run Firestore adapter against Local Emulator Suite
        shell: bash
        run: >-
          pnpm dlx firebase-tools@15.24.0
          emulators:exec
          --only firestore
          --project demo-muc-firestore
          "pnpm --filter mcp-usage-control-firestore test:emulator"

  peer-compat:
    name: peer compat (${{ matrix.peer }} / ${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        peer: [mcp, redis]
        mode: [minimum, current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Resolve declared peer evidence version
        id: peer-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.peer }}" == "mcp" ]]; then
            package='@modelcontextprotocol/server'
            minimum='2.0.0'
            range='^2.0.0'
          else
            package='redis'
            minimum='6.2.0'
            range='^6.2.0'
          fi
          if [[ "${{ matrix.mode }}" == "minimum" ]]; then
            version="$minimum"
          else
            version="$(npm view "$package@$range" version --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing $package@$version (${{ matrix.mode }} evidence)."
      - name: Install selected peer without changing the declared contract
        shell: bash
        run: |
          set -euo pipefail
          cp packages/mcp/package.json /tmp/muc-mcp-package.json
          cp packages/redis/package.json /tmp/muc-redis-package.json
          cp pnpm-lock.yaml /tmp/muc-pnpm-lock.yaml
          version='${{ steps.peer-version.outputs.version }}'
          if [[ "${{ matrix.peer }}" == "mcp" ]]; then
            pnpm --filter mcp-usage-control-mcp add --save-dev --ignore-workspace-root-check --lockfile=false \
              "@modelcontextprotocol/server@$version" "@modelcontextprotocol/client@$version"
          else
            pnpm --filter mcp-usage-control-redis add --save-dev --ignore-workspace-root-check --lockfile=false \
              "redis@$version"
          fi
      - name: Start Redis peer fixture
        if: matrix.peer == 'redis'
        run: docker run --detach --name muc-peer-redis -p 6379:6379 redis:7-alpine
      - name: Run peer integration evidence
        env:
          REDIS_URL: redis://127.0.0.1:6379
        shell: bash
        run: |
          set -euo pipefail
          # Fresh CI checkouts do not contain generated dist/. Build against the
          # selected peer first so the matrix proves both type compatibility and
          # runtime behavior instead of depending on a developer workstation's dist.
          pnpm build
          if [[ "${{ matrix.peer }}" == "mcp" ]]; then
            pnpm --filter mcp-usage-control-mcp test
          else
            for attempt in {1..30}; do
              if docker exec muc-peer-redis redis-cli ping 2>/dev/null | grep -qx PONG; then break; fi
              sleep 1
            done
            pnpm --filter mcp-usage-control-redis test
          fi
      - name: Restore and verify declared peer contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/muc-mcp-package.json packages/mcp/package.json
          cp /tmp/muc-redis-package.json packages/redis/package.json
          cp /tmp/muc-pnpm-lock.yaml pnpm-lock.yaml
          test "$(node -p "require('./packages/mcp/package.json').peerDependencies['@modelcontextprotocol/server']")" = '^2.0.0'
          test "$(node -p "require('./packages/redis/package.json').peerDependencies.redis")" = '^6.2.0'
          cmp -s /tmp/muc-mcp-package.json packages/mcp/package.json
          cmp -s /tmp/muc-redis-package.json packages/redis/package.json
          cmp -s /tmp/muc-pnpm-lock.yaml pnpm-lock.yaml

  release-safety:
    name: test (22)
    if: always()
    needs: [changes, docs-only, node, dependency-review, peer-compat, cloudflare, firestore]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable release-safety evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY_RESULT: ${{ needs.docs-only.result }}
          NODE_RESULT: ${{ needs.node.result }}
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          PEER_COMPAT_RESULT: ${{ needs.peer-compat.result }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
          RUN_CLOUDFLARE: ${{ needs.changes.outputs.run_cloudflare }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare.result }}
          RUN_FIRESTORE: ${{ needs.changes.outputs.run_firestore }}
          FIRESTORE_RESULT: ${{ needs.firestore.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$RUN_FULL" == "true" ]]; then
            test "$DOCS_ONLY_RESULT" = "skipped"
            test "$NODE_RESULT" = "success"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              test "$DEPENDENCY_REVIEW_RESULT" = "success"
            else
              test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
            fi
            test "$PEER_COMPAT_RESULT" = "success"
          else
            test "$DOCS_ONLY_RESULT" = "success"
            test "$NODE_RESULT" = "skipped"
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
            test "$PEER_COMPAT_RESULT" = "skipped"
          fi

          if [[ "$RUN_CLOUDFLARE" == "true" ]]; then
            test "$CLOUDFLARE_RESULT" = "success"
          else
            test "$CLOUDFLARE_RESULT" = "skipped"
          fi

          if [[ "$RUN_FIRESTORE" == "true" ]]; then
            test "$FIRESTORE_RESULT" = "success"
          else
            test "$FIRESTORE_RESULT" = "skipped"
          fi

          echo "Aggregate release-safety evidence satisfied."
