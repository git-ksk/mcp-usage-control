name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; running full CI conservatively."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")

          if (( ${#changed[@]} == 0 )); then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "No changed paths detected; running full CI conservatively."
            exit 0
          fi

          run_full=false
          for path in "${changed[@]}"; do
            case "$path" in
              docs/*|*.md)
                ;;
              *)
                run_full=true
                break
                ;;
            esac
          done

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"

          if [[ "$run_full" == "true" ]]; then
            echo "At least one non-documentation path changed; running full CI."
          else
            echo "Documentation-only change; using the lightweight required-check path."
          fi

  test:
    needs: changes
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Documentation-only fast path
        if: needs.changes.outputs.run_full != 'true'
        run: echo "Documentation-only change; heavy Node/Redis/package checks are not required."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.run_full == 'true'

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.run_full == 'true'
        with:
          version: 10.15.0

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.run_full == 'true'
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.run_full == 'true'

      - name: Start Redis
        if: needs.changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name muc-redis -p 6379:6379 redis:7-alpine >/dev/null
          for attempt in {1..30}; do
            if docker exec muc-redis redis-cli ping 2>/dev/null | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs muc-redis >&2 || true
          exit 1

      - run: pnpm check
        if: needs.changes.outputs.run_full == 'true'

      - name: Verify public package versions are aligned
        if: needs.changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./packages/core/package.json').version")"
          for dir in packages/core packages/mcp packages/redis packages/cloudflare packages/firestore; do
            actual="$(node -p "require('./${dir}/package.json').version")"
            test "$actual" = "$expected"
          done

      - name: Pack public packages with npm
        if: needs.changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          (cd packages/core && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/mcp && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/redis && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/cloudflare && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/firestore && npm pack --pack-destination /tmp/muc-packs)
          git diff --exit-code -- \
            packages/core/package.json \
            packages/mcp/package.json \
            packages/redis/package.json \
            packages/cloudflare/package.json \
            packages/firestore/package.json

      - name: Verify package contents
        if: needs.changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/muc-packs -name '*.tgz' | wc -l)" -eq 5
          for archive in /tmp/muc-packs/*.tgz; do
            listing="$(tar -tzf "$archive")"
            grep -qx 'package/dist/index.js' <<<"$listing"
            grep -qx 'package/dist/index.d.ts' <<<"$listing"
            grep -qx 'package/README.md' <<<"$listing"
            grep -qx 'package/LICENSE' <<<"$listing"
            if grep -Eq '^package/(src/|dist/.*(\.test\.|\.integration\.test\.))' <<<"$listing"; then
              echo "source or compiled test files leaked into $archive" >&2
              printf '%s\n' "$listing" >&2
              exit 1
            fi
            manifest="$(tar -xOf "$archive" package/package.json)"
            if grep -q 'workspace:' <<<"$manifest"; then
              echo "workspace protocol leaked into $archive" >&2
              exit 1
            fi
            if grep -q 'pack-workspace-deps' <<<"$manifest"; then
              echo "prepack helper leaked into packed manifest for $archive" >&2
              exit 1
            fi
          done
          version="$(node -p "require('./packages/core/package.json').version")"
          core_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-${version}.tgz")"
          grep -qx 'package/dist/store-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/store-conformance.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/progressive-store-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/progressive-store-conformance.d.ts' <<<"$core_listing"
          grep -qx 'package/dist/vector-store-conformance.js' <<<"$core_listing"
          grep -qx 'package/dist/vector-store-conformance.d.ts' <<<"$core_listing"
          mcp_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-mcp-${version}.tgz")"
          grep -qx 'package/dist/flow-store-conformance.js' <<<"$mcp_listing"
          grep -qx 'package/dist/flow-store-conformance.d.ts' <<<"$mcp_listing"
          cloudflare_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-cloudflare-${version}.tgz")"
          grep -qx 'package/dist/worker.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/worker.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/versioned-worker.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation-protocol.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/maintenance.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/maintenance.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/maintenance-protocol.js' <<<"$cloudflare_listing"
          redis_listing="$(tar -tzf "/tmp/muc-packs/mcp-usage-control-redis-${version}.tgz")"
          grep -qx 'package/dist/mcp-flow.js' <<<"$redis_listing"
          grep -qx 'package/dist/mcp-flow.d.ts' <<<"$redis_listing"

      - name: Install tarballs in a clean consumer project
        if: needs.changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-consumer
          mkdir -p /tmp/muc-consumer
          cd /tmp/muc-consumer
          npm init -y >/dev/null
          version="$(node -p "require('$GITHUB_WORKSPACE/packages/core/package.json').version")"
          npm install \
            /tmp/muc-packs/mcp-usage-control-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-mcp-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-redis-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-cloudflare-${version}.tgz \
            /tmp/muc-packs/mcp-usage-control-firestore-${version}.tgz \
            @modelcontextprotocol/server@2.0.0 \
            redis@6.2.0 \
            --ignore-scripts
          node --input-type=module <<'NODE'
          import { MemoryUsageStore, UsageControl } from 'mcp-usage-control';
          import {
            assertUsageStoreConformance,
            runProgressiveUsageStoreConformance,
            runVectorUsageStoreConformance,
          } from 'mcp-usage-control/conformance';
          import { FirestoreUsageStore } from 'mcp-usage-control-firestore';
          import { protectTool } from 'mcp-usage-control-mcp';
          import { assertMcpUsageFlowStoreConformance } from 'mcp-usage-control-mcp/conformance';
          import { RedisUsageStore } from 'mcp-usage-control-redis';
          import { RedisMcpUsageFlowStore } from 'mcp-usage-control-redis/mcp-flow';
          import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';
          import {
            createReconciliableCloudflareUsageStoreGateway,
            reconcileRemoteCloudflareReserve,
          } from 'mcp-usage-control-cloudflare/reconciliation';
          import {
            createCloudflareBudgetMaintenanceGateway,
            pruneRemoteCloudflareHistoricalBudgets,
          } from 'mcp-usage-control-cloudflare/maintenance';
          if (![
            MemoryUsageStore,
            UsageControl,
            assertUsageStoreConformance,
            runProgressiveUsageStoreConformance,
            FirestoreUsageStore,
            protectTool,
            assertMcpUsageFlowStoreConformance,
            RedisUsageStore,
            RedisMcpUsageFlowStore,
            CloudflareUsageStore,
            RemoteCloudflareUsageStore,
            createReconciliableCloudflareUsageStoreGateway,
            reconcileRemoteCloudflareReserve,
            createCloudflareBudgetMaintenanceGateway,
            pruneRemoteCloudflareHistoricalBudgets,
          ].every(Boolean)) {
            throw new Error('public package import smoke test failed');
          }
          NODE

      - name: Stop Redis
        if: always() && needs.changes.outputs.run_full == 'true'
        run: docker rm --force muc-redis >/dev/null 2>&1 || true
