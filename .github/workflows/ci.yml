name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack public packages
        run: |
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          pnpm --dir packages/core pack --pack-destination /tmp/muc-packs
          pnpm --dir packages/mcp pack --pack-destination /tmp/muc-packs
          pnpm --dir packages/redis pack --pack-destination /tmp/muc-packs
      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/muc-packs -name '*.tgz' | wc -l)" -eq 3
          for archive in /tmp/muc-packs/*.tgz; do
            listing="$(tar -tzf "$archive")"
            grep -qx 'package/dist/index.js' <<<"$listing"
            grep -qx 'package/dist/index.d.ts' <<<"$listing"
            grep -qx 'package/README.md' <<<"$listing"
            grep -qx 'package/LICENSE' <<<"$listing"
            if grep -Eq '^package/(src/|dist/.*(\.test\.|\.integration\.test\.))' <<<"$listing"; then
              echo "source or compiled test files leaked into $archive" >&2
              printf '%s\n' "$listing" >&2
              exit 1
            fi
            if tar -xOf "$archive" package/package.json | grep -q 'workspace:'; then
              echo "workspace protocol leaked into $archive" >&2
              exit 1
            fi
          done
      - name: Install tarballs in a clean consumer project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-consumer
          mkdir -p /tmp/muc-consumer
          cd /tmp/muc-consumer
          npm init -y >/dev/null
          npm install \
            /tmp/muc-packs/mcp-usage-control-0.1.0.tgz \
            /tmp/muc-packs/mcp-usage-control-mcp-0.1.0.tgz \
            /tmp/muc-packs/mcp-usage-control-redis-0.1.0.tgz \
            @modelcontextprotocol/server@2.0.0 \
            redis@6.2.0 \
            --ignore-scripts
          node --input-type=module <<'NODE'
          import { MemoryUsageStore, UsageControl } from 'mcp-usage-control';
          import { protectTool } from 'mcp-usage-control-mcp';
          import { RedisUsageStore } from 'mcp-usage-control-redis';
          if (![MemoryUsageStore, UsageControl, protectTool, RedisUsageStore].every(Boolean)) {
            throw new Error('public package import smoke test failed');
          }
          NODE
