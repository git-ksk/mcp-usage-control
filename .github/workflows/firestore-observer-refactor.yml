name: Firestore Observer Refactor

on:
  push:
    branches:
      - feat/firestore-usage-store
    paths:
      - '.github/workflows/firestore-observer-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/firestore-usage-store
      - name: Apply scoped Firestore-only observer refactor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('packages/firestore/src/index.ts')
          source = source_path.read_text()

          replacements = [
              ("  emitUsageEvent,\n", ""),
              ("  type UsageObserver,\n", ""),
              ("  observer?: UsageObserver;", "  observer?: FirestoreRecoveryObserver;"),
              ("  private readonly observer?: UsageObserver;", "  private readonly observer?: FirestoreRecoveryObserver;"),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one source occurrence: {old!r}')
              source = source.replace(old, new, 1)

          options_marker = "export interface FirestoreUsageStoreOptions {"
          if source.count(options_marker) != 1:
              raise SystemExit('FirestoreUsageStoreOptions marker mismatch')
          observer_types = """export interface FirestoreRecoveryEvent {
            type: 'reservation.recovered';
            timestamp: number;
            store: 'firestore';
            recovery: 'pending_released' | 'liable_retained';
            reservationId: string;
            reservedUnits: number;
            count: 1;
          }

          export interface FirestoreRecoveryObserver {
            onEvent(event: FirestoreRecoveryEvent): void | Promise<void>;
          }

          """
          source = source.replace(options_marker, observer_types + options_marker, 1)

          old_emit = """    emitUsageEvent(this.observer, {
                type: 'reservation.recovered',
                timestamp: now,
                store: 'firestore',
                recovery: recovery.kind,
                reservationId,
                reservedUnits: recovery.reservedUnits,
                count: 1,
              });"""
          new_emit = """    emitFirestoreRecovery(this.observer, {
                type: 'reservation.recovered',
                timestamp: now,
                store: 'firestore',
                recovery: recovery.kind,
                reservationId,
                reservedUnits: recovery.reservedUnits,
                count: 1,
              });"""
          if source.count(old_emit) != 1:
              raise SystemExit('recovery emitter block mismatch')
          source = source.replace(old_emit, new_emit, 1)

          function_marker = "async function recoverExpiredReservation("
          if source.count(function_marker) != 1:
              raise SystemExit('recovery function marker mismatch')
          helper = """function emitFirestoreRecovery(
            observer: FirestoreRecoveryObserver | undefined,
            event: FirestoreRecoveryEvent,
          ): void {
            if (!observer) return;
            try {
              const result = observer.onEvent(event);
              if (result && typeof (result as Promise<void>).catch === 'function') {
                void (result as Promise<void>).catch(() => undefined);
              }
            } catch {
              // Observability remains best-effort and never changes enforcement state.
            }
          }

          """
          source = source.replace(function_marker, helper + function_marker, 1)
          source_path.write_text(source)

          test_path = Path('packages/firestore/src/index.test.ts')
          test = test_path.read_text()
          old_import = "import type { UsageEvent, UsageRequest } from 'mcp-usage-control';"
          new_import = "import type { UsageRequest } from 'mcp-usage-control';"
          if test.count(old_import) != 1:
              raise SystemExit('test core type import mismatch')
          test = test.replace(old_import, new_import, 1)
          import_marker = "  FirestoreUsageStore,\n"
          if test.count(import_marker) != 1:
              raise SystemExit('test adapter import marker mismatch')
          test = test.replace(
              import_marker,
              import_marker + "  type FirestoreRecoveryEvent,\n",
              1,
          )
          if test.count('const events: UsageEvent[] = [];') != 1:
              raise SystemExit('test event collection mismatch')
          test = test.replace(
              'const events: UsageEvent[] = [];',
              'const events: FirestoreRecoveryEvent[] = [];',
              1,
          )
          test_path.write_text(test)
          PY
          git diff --check
          git diff -- packages/firestore/src/index.ts packages/firestore/src/index.test.ts
      - name: Commit refactor and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/firestore/src/index.ts packages/firestore/src/index.test.ts
          git rm .github/workflows/firestore-observer-refactor.yml
          git commit -m 'refactor: keep Firestore recovery observer adapter-local'
          git push origin HEAD:feat/firestore-usage-store
