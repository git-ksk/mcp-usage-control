name: Fix v1 readiness baseline

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/v1.0.0
          fetch-depth: 0
      - name: Fix remaining active v0.13 baseline lines
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
            "docs/v1-readiness.md": (
              "The source-release baseline is `v0.13.0`. npm publication is a separate operation and has not occurred.",
              "The source-release baseline is `v1.0.0`. npm publication is a separate operation and has not occurred.",
            ),
            "docs/v1-readiness.ja.md": (
              "source-release baselineは `v0.13.0` です。npm publicationは別操作で、まだ実行していません。",
              "source-release baselineは `v1.0.0` です。npm publicationは別操作で、まだ実行していません。",
            ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected baseline text missing from {filename}")
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-v1-readiness-baseline.yml
          git add docs/v1-readiness.md docs/v1-readiness.ja.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: align v1 readiness release baseline"
          git push origin HEAD:release/v1.0.0
