name: Align unpublished v0.1.0 tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retag-v0.1.0-docs.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move unpublished v0.1.0 tag to the tested docs commit
        env:
          TARGET: 33962dbb7c468727d5feb8d5e98042c508555085
          TAG: v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git cat-file -e "$TARGET^{commit}"
          git tag -f "$TAG" "$TARGET"
          git push --force origin "refs/tags/$TAG"
