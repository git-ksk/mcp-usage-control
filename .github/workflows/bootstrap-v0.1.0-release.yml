name: Bootstrap v0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v0.1.0-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the existing v0.1.0 release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag=v0.1.0
