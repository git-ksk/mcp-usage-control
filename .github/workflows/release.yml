name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate/release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Verify package versions match tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/redis packages/cloudflare packages/firestore; do
            actual="$(node -p "require('./${dir}/package.json').version")"
            test "$actual" = "$VERSION"
          done

      - name: Pack and inspect public packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          for dir in core mcp redis cloudflare firestore; do
            (cd "packages/$dir" && npm pack --pack-destination /tmp/muc-packs)
          done
          git diff --exit-code -- \
            packages/core/package.json \
            packages/mcp/package.json \
            packages/redis/package.json \
            packages/cloudflare/package.json \
            packages/firestore/package.json
          test "$(find /tmp/muc-packs -name '*.tgz' | wc -l)" -eq 5
          for archive in /tmp/muc-packs/*.tgz; do
            listing="$(tar -tzf "$archive")"
            grep -qx 'package/dist/index.js' <<<"$listing"
            grep -qx 'package/dist/index.d.ts' <<<"$listing"
            grep -qx 'package/README.md' <<<"$listing"
            grep -qx 'package/LICENSE' <<<"$listing"
            if grep -Eq '^package/(src/|dist/.*(\.test\.|\.integration\.test\.))' <<<"$listing"; then
              echo "source or compiled test files leaked into $archive" >&2
              exit 1
            fi
            manifest="$(tar -xOf "$archive" package/package.json)"
            ! grep -q 'workspace:' <<<"$manifest"
            ! grep -q 'pack-workspace-deps' <<<"$manifest"
          done

      - name: Build release notes from changelog
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi
