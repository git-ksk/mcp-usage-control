name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish/retry (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm CLI with Trusted Publishing and staged-publishing support
        run: npm install --global npm@11.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Verify package versions match tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/redis packages/cloudflare; do
            actual="$(node -p "require('./${dir}/package.json').version")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "$dir version $actual does not match tag $VERSION" >&2
              exit 1
            fi
          done

      - name: Pack and inspect packages with npm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          (cd packages/core && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/mcp && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/redis && npm pack --pack-destination /tmp/muc-packs)
          (cd packages/cloudflare && npm pack --pack-destination /tmp/muc-packs)
          git diff --exit-code -- \
            packages/core/package.json \
            packages/mcp/package.json \
            packages/redis/package.json \
            packages/cloudflare/package.json
          test "$(find /tmp/muc-packs -name '*.tgz' | wc -l)" -eq 4
          for archive in /tmp/muc-packs/*.tgz; do
            listing="$(tar -tzf "$archive")"
            grep -qx 'package/dist/index.js' <<<"$listing"
            grep -qx 'package/dist/index.d.ts' <<<"$listing"
            grep -qx 'package/README.md' <<<"$listing"
            grep -qx 'package/LICENSE' <<<"$listing"
            if grep -Eq '^package/(src/|dist/.*(\.test\.|\.integration\.test\.))' <<<"$listing"; then
              echo "source or compiled test files leaked into $archive" >&2
              printf '%s\n' "$listing" >&2
              exit 1
            fi
            manifest="$(tar -xOf "$archive" package/package.json)"
            if grep -q 'workspace:' <<<"$manifest"; then
              echo "workspace protocol leaked into $archive" >&2
              exit 1
            fi
            if grep -q 'pack-workspace-deps' <<<"$manifest"; then
              echo "prepack helper leaked into published manifest for $archive" >&2
              exit 1
            fi
          done
          cloudflare_listing="$(tar -tzf /tmp/muc-packs/mcp-usage-control-cloudflare-${{ steps.release.outputs.version }}.tgz)"
          grep -qx 'package/dist/worker.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/worker.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/versioned-worker.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation.js' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation.d.ts' <<<"$cloudflare_listing"
          grep -qx 'package/dist/reconciliation-protocol.js' <<<"$cloudflare_listing"

      - name: Install tarballs in a clean consumer project
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-consumer
          mkdir -p /tmp/muc-consumer
          cd /tmp/muc-consumer
          npm init -y >/dev/null
          npm install \
            "/tmp/muc-packs/mcp-usage-control-${VERSION}.tgz" \
            "/tmp/muc-packs/mcp-usage-control-mcp-${VERSION}.tgz" \
            "/tmp/muc-packs/mcp-usage-control-redis-${VERSION}.tgz" \
            "/tmp/muc-packs/mcp-usage-control-cloudflare-${VERSION}.tgz" \
            @modelcontextprotocol/server@2.0.0 \
            redis@6.2.0 \
            --ignore-scripts
          node --input-type=module <<'NODE'
          import { MemoryUsageStore, UsageControl } from 'mcp-usage-control';
          import { protectTool } from 'mcp-usage-control-mcp';
          import { RedisUsageStore } from 'mcp-usage-control-redis';
          import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';
          import {
            createReconciliableCloudflareUsageStoreGateway,
            reconcileRemoteCloudflareReserve,
          } from 'mcp-usage-control-cloudflare/reconciliation';
          if (![
            MemoryUsageStore,
            UsageControl,
            protectTool,
            RedisUsageStore,
            CloudflareUsageStore,
            RemoteCloudflareUsageStore,
            createReconciliableCloudflareUsageStoreGateway,
            reconcileRemoteCloudflareReserve,
          ].every(Boolean)) {
            throw new Error('public package import smoke test failed');
          }
          NODE

      - name: Publish packages in dependency order
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN || true
          fi

          publish_one() {
            local name="$1"
            local archive="$2"
            if npm view "${name}@${VERSION}" version --json >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published; skipping"
              return 0
            fi
            npm publish "$archive" --access public --provenance
          }

          publish_one mcp-usage-control "/tmp/muc-packs/mcp-usage-control-${VERSION}.tgz"
          publish_one mcp-usage-control-mcp "/tmp/muc-packs/mcp-usage-control-mcp-${VERSION}.tgz"
          publish_one mcp-usage-control-redis "/tmp/muc-packs/mcp-usage-control-redis-${VERSION}.tgz"
          publish_one mcp-usage-control-cloudflare "/tmp/muc-packs/mcp-usage-control-cloudflare-${VERSION}.tgz"

      - name: Verify registry versions
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for name in mcp-usage-control mcp-usage-control-mcp mcp-usage-control-redis mcp-usage-control-cloudflare; do
            published="$(npm view "${name}@${VERSION}" version)"
            test "$published" = "$VERSION"
          done

      - name: Build release notes from changelog entry
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Create GitHub Release after registry success
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi
