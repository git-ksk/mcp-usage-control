name: Bootstrap v0.10.0 release tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.10-bootstrap.yml'

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create exact v0.10.0 tag and dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.10.0
          RELEASE_COMMIT: a09d0a9c1a8b141d296d0b05d2fd1646f81215c5
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

          version="$(git show "$RELEASE_COMMIT:packages/core/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$version" = "0.10.0"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            remote_tag="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
            test "$remote_tag" = "$RELEASE_COMMIT"
          else
            git tag "$TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$TAG"
          fi

          gh workflow run release.yml --ref main -f tag="$TAG"
