name: Bootstrap v0.1.0 tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v0.1.0-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag the tested release commit exactly once
        env:
          TARGET: 1c34e6960ffc99cfc9325f97a4d72ba2f344eb15
          TAG: v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$TAG")"
            test "$existing" = "$TARGET"
            echo "$TAG already points to $TARGET"
            exit 0
          fi
          git cat-file -e "$TARGET^{commit}"
          git tag "$TAG" "$TARGET"
          git push origin "refs/tags/$TAG"
