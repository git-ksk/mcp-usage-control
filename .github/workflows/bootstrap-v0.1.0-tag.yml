name: Retract unpublished v0.1.0 tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v0.1.0-tag.yml'

permissions:
  contents: write

jobs:
  retract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove the unpublished tag if present
        env:
          TAG: v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git push origin ":refs/tags/$TAG"
            echo "Removed unpublished tag $TAG"
          else
            echo "$TAG is already absent"
          fi
