name: v0.9 Release Execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0.9-release-execution.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.9.0
      RELEASE_VERSION: 0.9.0
      RELEASE_SHA: e2a8f8e5dcf725a2c085faa3170a8e38e91504d2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact release target
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          for manifest in \
            packages/core/package.json \
            packages/mcp/package.json \
            packages/redis/package.json \
            packages/cloudflare/package.json \
            packages/firestore/package.json; do
            version="$(git show "${RELEASE_SHA}:${manifest}" | jq -r '.version')"
            test "$version" = "$RELEASE_VERSION"
          done
          git show "${RELEASE_SHA}:CHANGELOG.md" | grep -q '^## \[0.9.0\] - 2026-08-22$'
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to retag" >&2
            exit 1
          fi

      - name: Tag exact tested main content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Dispatch and require GitHub source release
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"

          run_id=''
          for attempt in {1..60}; do
            latest="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$latest" != "0" && "$latest" != "$before" ]]; then
              run_id="$latest"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "source release workflow run: $run_id"
          gh run watch "$run_id" --exit-status
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,targetCommitish,url >/tmp/release.json
          test "$(jq -r '.tagName' /tmp/release.json)" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' /tmp/release.json)" = "false"

      - name: Dispatch and require first npm publication
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --workflow npm-publish.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run npm-publish.yml --ref main -f tag="$RELEASE_TAG" -f confirm=true

          run_id=''
          for attempt in {1..60}; do
            latest="$(gh run list --workflow npm-publish.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$latest" != "0" && "$latest" != "$before" ]]; then
              run_id="$latest"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "npm publication workflow run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify npm registry versions, integrity, and provenance
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            mcp-usage-control
            mcp-usage-control-mcp
            mcp-usage-control-redis
            mcp-usage-control-cloudflare
            mcp-usage-control-firestore
          )

          for package in "${packages[@]}"; do
            found=''
            for attempt in {1..30}; do
              found="$(npm view "${package}@${RELEASE_VERSION}" version --json 2>/dev/null | tr -d '"' || true)"
              if [[ "$found" = "$RELEASE_VERSION" ]]; then
                break
              fi
              sleep 3
            done
            test "$found" = "$RELEASE_VERSION"
            integrity="$(npm view "${package}@${RELEASE_VERSION}" dist.integrity --json | tr -d '"')"
            test -n "$integrity"
            attestations="$(npm view "${package}@${RELEASE_VERSION}" dist.attestations --json)"
            test "$attestations" != "null"
            test -n "$attestations"
            echo "verified ${package}@${RELEASE_VERSION}"
          done

      - name: Verify clean registry consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts \
            "mcp-usage-control@${RELEASE_VERSION}" \
            "mcp-usage-control-mcp@${RELEASE_VERSION}" \
            "mcp-usage-control-redis@${RELEASE_VERSION}" \
            "mcp-usage-control-cloudflare@${RELEASE_VERSION}" \
            "mcp-usage-control-firestore@${RELEASE_VERSION}" \
            '@modelcontextprotocol/server@2.0.0' \
            'redis@6.2.0'
          node --input-type=module <<'NODE'
          import { MemoryUsageStore, UsageControl } from 'mcp-usage-control';
          import { protectTool } from 'mcp-usage-control-mcp';
          import { RedisUsageStore } from 'mcp-usage-control-redis';
          import { CloudflareUsageStore } from 'mcp-usage-control-cloudflare';
          import { FirestoreUsageStore } from 'mcp-usage-control-firestore';
          for (const value of [MemoryUsageStore, UsageControl, protectTool, RedisUsageStore, CloudflareUsageStore, FirestoreUsageStore]) {
            if (typeof value !== 'function') throw new Error('registry consumer export verification failed');
          }
          NODE
