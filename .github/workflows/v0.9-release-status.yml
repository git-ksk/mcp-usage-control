name: v0.9 Source Release Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0.9-release-status.yml'

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  guard-and-verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.9.0
      RELEASE_VERSION: 0.9.0
      RELEASE_SHA: e2a8f8e5dcf725a2c085faa3170a8e38e91504d2
      CUTOFF: '2026-08-22T10:50:00Z'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cancel v0.9 operator and npm publication runs
        shell: bash
        run: |
          set -euo pipefail
          for workflow in v0.9-release-execution.yml npm-publish.yml; do
            for status in queued in_progress waiting; do
              gh run list \
                --workflow "$workflow" \
                --status "$status" \
                --limit 30 \
                --json databaseId,createdAt \
                --jq ".[] | select(.createdAt >= \"${CUTOFF}\") | .databaseId" \
              | while read -r run_id; do
                  [[ -n "$run_id" ]] || continue
                  echo "Cancelling $workflow run $run_id"
                  gh run cancel "$run_id" || true
                done
            done
          done

      - name: Confirm no npm publication remains active
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            active="$({
              gh run list --workflow npm-publish.yml --status queued --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"${CUTOFF}\") | .databaseId"
              gh run list --workflow npm-publish.yml --status in_progress --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"${CUTOFF}\") | .databaseId"
              gh run list --workflow npm-publish.yml --status waiting --limit 30 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"${CUTOFF}\") | .databaseId"
            } | sed '/^$/d')"
            if [[ -z "$active" ]]; then
              echo 'No queued/running npm publication remains.'
              exit 0
            fi
            sleep 2
          done
          echo 'npm publication run still active after cancellation attempts' >&2
          exit 1

      - name: Verify exact tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          actual="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$actual" = "$RELEASE_SHA"

      - name: Ensure GitHub source Release exists
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,targetCommitish,url >/tmp/release.json 2>/dev/null; then
            echo 'GitHub Release already exists.'
          else
            before="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"
            run_id=''
            for attempt in {1..60}; do
              latest="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
              if [[ "$latest" != "0" && "$latest" != "$before" ]]; then
                run_id="$latest"
                break
              fi
              sleep 2
            done
            test -n "$run_id"
            echo "source release workflow run: $run_id"
            gh run watch "$run_id" --exit-status
            gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,targetCommitish,url >/tmp/release.json
          fi
          test "$(jq -r '.tagName' /tmp/release.json)" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' /tmp/release.json)" = 'false'
          test "$(jq -r '.isPrerelease' /tmp/release.json)" = 'false'

      - name: Verify v0.9 remains unpublished on npm
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            mcp-usage-control
            mcp-usage-control-mcp
            mcp-usage-control-redis
            mcp-usage-control-cloudflare
            mcp-usage-control-firestore
          )
          published=0
          : > /tmp/registry.txt
          for package in "${packages[@]}"; do
            version="$(npm view "${package}@${RELEASE_VERSION}" version --json 2>/dev/null | tr -d '"' || true)"
            if [[ "$version" = "$RELEASE_VERSION" ]]; then
              echo "- ${package}@${RELEASE_VERSION}: PUBLISHED" >> /tmp/registry.txt
              published=1
            else
              echo "- ${package}@${RELEASE_VERSION}: not published" >> /tmp/registry.txt
            fi
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"
          test "$published" = '0'

      - name: Record source-only release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ops="$(gh run list --workflow v0.9-release-execution.yml --limit 1 --json databaseId,status,conclusion,url,createdAt --jq '.[0] // {}')"
          source="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId,status,conclusion,url,createdAt --jq '.[0] // {}')"
          publish="$(gh run list --workflow npm-publish.yml --event workflow_dispatch --limit 1 --json databaseId,status,conclusion,url,createdAt --jq '.[0] // {}')"
          {
            echo '## v0.9.0 source-release closeout evidence'
            echo
            echo "- tag: \`${RELEASE_TAG}\` -> \`${RELEASE_SHA}\`"
            echo "- release operator: \`$(jq -r '.databaseId // "none"' <<<"$ops")\` — \`$(jq -r '.status // "missing"' <<<"$ops")\` / \`$(jq -r '.conclusion // "pending"' <<<"$ops")\`"
            echo "- GitHub source release: \`$(jq -r '.databaseId // "none"' <<<"$source")\` — \`$(jq -r '.status // "missing"' <<<"$source")\` / \`$(jq -r '.conclusion // "pending"' <<<"$source")\`"
            echo "- npm publication workflow: \`$(jq -r '.databaseId // "none"' <<<"$publish")\` — \`$(jq -r '.status // "missing"' <<<"$publish")\` / \`$(jq -r '.conclusion // "not-run"' <<<"$publish")\`"
            echo '- npm decision: deferred; Issue #6 remains open.'
            echo
            echo '### Registry check'
            if [[ -f /tmp/registry.txt ]]; then cat /tmp/registry.txt; else echo '- registry check did not complete'; fi
          } > /tmp/status.md
          gh issue comment 148 --body-file /tmp/status.md
