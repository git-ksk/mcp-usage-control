name: Align unpublished v0.1.0 tag with Cloudflare adapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retag-v0.1.0-cloudflare.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move unpublished v0.1.0 tag to tested Cloudflare adapter commit
        env:
          TARGET: cd73a374bf97e3cbfdc809a2fc0bdb6521d6cdc7
          TAG: v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git cat-file -e "$TARGET^{commit}"
          git tag -f "$TAG" "$TARGET"
          git push --force origin "refs/tags/$TAG"
