name: Cloudflare Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_integration: ${{ steps.scope.outputs.run_integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Cloudflare-relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; running Cloudflare integration conservatively."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")
          run_integration=false
          for path in "${changed[@]}"; do
            case "$path" in
              packages/cloudflare/*|packages/cloudflare/**|packages/core/*|packages/core/**|.github/workflows/cloudflare-integration.yml)
                run_integration=true
                break
                ;;
            esac
          done
          echo "run_integration=$run_integration" >> "$GITHUB_OUTPUT"

  workerd:
    needs: changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run Durable Objects integration against local workerd
        shell: bash
        env:
          MCP_USAGE_CLOUDFLARE_TOKEN: local-integration-token
          MCP_USAGE_CLOUDFLARE_OLD_TOKEN: rotated-out-local-token
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.114.0 dev --local \
            --config packages/cloudflare/wrangler.test.jsonc \
            --port 8799 >/tmp/muc-cloudflare-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; cat /tmp/muc-cloudflare-wrangler.log || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -sS http://127.0.0.1:8799/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'local workerd did not become ready' >&2
            exit 1
          fi

          node packages/cloudflare/test/integration.mjs
          node packages/cloudflare/test/conformance.mjs
          node packages/cloudflare/test/rotation.mjs
          node packages/cloudflare/test/reconciliation.mjs
          node packages/cloudflare/test/maintenance.mjs
          node packages/cloudflare/test/authorization.mjs

  cloudflare-safety:
    name: cloudflare-safety
    if: always()
    needs: [changes, workerd]
    runs-on: ubuntu-latest
    steps:
      - name: Require integration when applicable
        env:
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKERD_RESULT: ${{ needs.workerd.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$RUN_INTEGRATION" == "true" ]]; then
            test "$WORKERD_RESULT" = "success"
          else
            test "$WORKERD_RESULT" = "skipped"
          fi
