name: Cloudflare Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_integration: ${{ steps.scope.outputs.run_integration }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Detect Cloudflare-relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; running Cloudflare integration conservatively."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")
          run_integration=false
          for path in "${changed[@]}"; do
            case "$path" in
              packages/cloudflare/*|packages/cloudflare/**|packages/core/*|packages/core/**|packages/mcp/*|packages/mcp/**|examples/mcp-durable-multi-round/*|examples/mcp-durable-multi-round/**|.github/workflows/cloudflare-integration.yml)
                run_integration=true
                break
                ;;
            esac
          done
          echo "run_integration=$run_integration" >> "$GITHUB_OUTPUT"

  workerd:
    needs: changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run Durable Objects integration against local workerd
        shell: bash
        env:
          MCP_USAGE_CLOUDFLARE_TOKEN: local-integration-token
          MCP_USAGE_CLOUDFLARE_OLD_TOKEN: rotated-out-local-token
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.114.0 dev --local \
            --config packages/cloudflare/wrangler.test.jsonc \
            --port 8799 >/tmp/muc-cloudflare-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; cat /tmp/muc-cloudflare-wrangler.log || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -sS http://127.0.0.1:8799/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'local workerd did not become ready' >&2
            exit 1
          fi

          node packages/cloudflare/test/integration.mjs
          node packages/cloudflare/test/conformance.mjs
          node packages/cloudflare/test/flow-conformance.mjs
          node examples/mcp-durable-multi-round/run.mjs cloudflare
          node packages/cloudflare/test/rotation.mjs
          node packages/cloudflare/test/reconciliation.mjs
          node packages/cloudflare/test/maintenance.mjs
          node packages/cloudflare/test/authorization.mjs

      - name: Install exact packed candidate into clean Cloudflare consumer and run real SDK + SQLite DO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/muc-cf-packs /tmp/muc-cf-consumer
          for dir in core mcp cloudflare; do
            (cd "packages/$dir" && npm pack --pack-destination /tmp/muc-cf-packs >/dev/null)
          done
          cd /tmp/muc-cf-consumer
          npm init -y >/dev/null
          npm install --ignore-scripts \
            /tmp/muc-cf-packs/mcp-usage-control-*.tgz \
            @modelcontextprotocol/client@2.3.1 \
            @modelcontextprotocol/server@2.3.1 \
            zod@^4.0.0
          cp "$GITHUB_WORKSPACE/examples/mcp-durable-multi-round/packed-cloudflare-worker.mjs" ./packed-cloudflare-worker.mjs
          cp "$GITHUB_WORKSPACE/packages/cloudflare/test/mcp-sdk-e2e.mjs" ./cloudflare-sdk-e2e.mjs
          sed 's#"main": "./test/worker.ts"#"main": "./packed-cloudflare-worker.mjs"#' \
            "$GITHUB_WORKSPACE/packages/cloudflare/wrangler.test.jsonc" > wrangler.jsonc
          # Use a different test port: the earlier source-workerd test may be
          # completing shutdown; do not accidentally reuse its HTTP endpoint.
          pnpm dlx wrangler@4.114.0 dev --local --config wrangler.jsonc --port 8800 \
            --persist-to /tmp/muc-cf-candidate-do >/tmp/muc-cf-candidate-workerd.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true; cat /tmp/muc-cf-candidate-workerd.log || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8800/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          MCP_USAGE_TEST_PORT=8800 node cloudflare-sdk-e2e.mjs

  cloudflare-safety:
    name: cloudflare-safety
    if: always()
    needs: [changes, workerd]
    runs-on: ubuntu-latest
    steps:
      - name: Require integration when applicable
        env:
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKERD_RESULT: ${{ needs.workerd.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$RUN_INTEGRATION" == "true" ]]; then
            test "$WORKERD_RESULT" = "success"
          else
            test "$WORKERD_RESULT" = "skipped"
          fi
