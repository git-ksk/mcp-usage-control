name: Synchronize Cloudflare adapter documentation

on:
  push:
    branches: [feat/cloudflare-durable-objects]
    paths:
      - '.github/workflows/sync-cloudflare-docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/cloudflare-durable-objects
      - name: Synchronize bilingual docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          def insert_before(path, marker, block):
              p = Path(path)
              text = p.read_text()
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}: {marker!r}')
              if block.strip() in text:
                  return
              p.write_text(text.replace(marker, block + marker, 1))

          # Top README package/distribution/docs entry points.
          replace_once(
              'README.md',
              '`mcp-usage-control`, `mcp-usage-control-mcp`, or `mcp-usage-control-redis`',
              '`mcp-usage-control`, `mcp-usage-control-mcp`, `mcp-usage-control-redis`, or `mcp-usage-control-cloudflare`',
          )
          replace_once(
              'README.md',
              '- **`mcp-usage-control-redis`** — atomic Redis store using Lua and Redis server time, with optional expiry-recovery observability.\n\nAll three packages are ESM and require Node.js 20+.',
              '- **`mcp-usage-control-redis`** — atomic Redis store using Lua and Redis server time, with optional expiry-recovery observability.\n- **`mcp-usage-control-cloudflare`** — Cloudflare Durable Objects + SQLite store with Worker-local and authenticated remote-client paths.\n\nAll four packages are ESM and require Node.js 20+.',
          )
          insert_before(
              'README.md',
              '## Safety invariants\n',
              """## Cloudflare Durable Objects store\n\n`mcp-usage-control-cloudflare` provides a SQLite-backed Durable Object transaction domain. Workers can use `CloudflareUsageStore` directly; applications outside Cloudflare can use `RemoteCloudflareUsageStore` through an explicitly authenticated Worker gateway. The adapter hashes operation/budget/outcome identifiers before the Cloudflare boundary and does not send tool arguments. Remote timeout/ACK ambiguity is surfaced rather than blindly retried.\n\nSee [Cloudflare adapter](docs/cloudflare.md) for Worker configuration, privacy, cleanup/cost behavior, and GCP/external usage.\n\n""",
          )
          replace_once(
              'README.md',
              '- [Redis adapter](docs/redis.md)\n- [API reference](docs/api-reference.md)',
              '- [Redis adapter](docs/redis.md)\n- [Cloudflare adapter](docs/cloudflare.md)\n- [API reference](docs/api-reference.md)',
          )

          replace_once(
              'README.ja.md',
              '`mcp-usage-control` / `mcp-usage-control-mcp` / `mcp-usage-control-redis`',
              '`mcp-usage-control` / `mcp-usage-control-mcp` / `mcp-usage-control-redis` / `mcp-usage-control-cloudflare`',
          )
          replace_once(
              'README.ja.md',
              '- **`mcp-usage-control-redis`** — LuaとRedis server timeを使うatomic Redis store。optionalなexpiry-recovery observabilityにも対応。\n\n3 packageともESM / Node.js 20+です。',
              '- **`mcp-usage-control-redis`** — LuaとRedis server timeを使うatomic Redis store。optionalなexpiry-recovery observabilityにも対応。\n- **`mcp-usage-control-cloudflare`** — Cloudflare Durable Objects + SQLite store。Worker-localとauthenticated remote-client pathを提供。\n\n4 packageともESM / Node.js 20+です。',
          )
          insert_before(
              'README.ja.md',
              '## Safety invariants\n',
              """## Cloudflare Durable Objects store\n\n`mcp-usage-control-cloudflare` はSQLite-backed Durable Objectをtransaction domainとして使います。Worker内では `CloudflareUsageStore`、Cloudflare外のapplicationでは明示認証付きWorker gateway経由の `RemoteCloudflareUsageStore` を利用できます。operation / budget / outcome identifierはCloudflare boundary前にhash化し、tool argumentsは送りません。remote timeout / ACK ambiguityはblind retryせず表面化します。\n\nWorker設定、privacy、cleanup / cost behavior、GCP等からの利用は [Cloudflare adapter](docs/cloudflare.ja.md) を参照してください。\n\n""",
          )
          replace_once(
              'README.ja.md',
              '- [Redis adapter](docs/redis.ja.md)\n- [API reference](docs/api-reference.ja.md)',
              '- [Redis adapter](docs/redis.ja.md)\n- [Cloudflare adapter](docs/cloudflare.ja.md)\n- [API reference](docs/api-reference.ja.md)',
          )

          # API reference.
          insert_before(
              'docs/api-reference.md',
              '## Numeric validation\n',
              """## `mcp-usage-control-cloudflare`\n\n### `CloudflareUsageStore`\n\nWorker-local `UsageStore` backed by a Durable Object namespace. Options include `domainName`, `cleanupBatchSize`, `idempotencyTtlMs`, and `observer`. One `domainName` is one atomic transaction domain.\n\n### `RemoteCloudflareUsageStore`\n\nHTTP `UsageStore` for applications outside Cloudflare. `endpoint` is required; non-local endpoints must use HTTPS. Optional request headers can be supplied directly or by callback. Timeout/network failures surface as `CloudflareUsageTransportError` and are not automatically retried.\n\n### `createCloudflareUsageStoreGateway()`\n\nCreates the Worker HTTP handler used by the remote store. An application-defined `authorize(request)` callback is mandatory. The gateway accepts only the hashed accounting protocol produced by the adapter and returns generic failures rather than raw Durable Object exceptions.\n\n### `UsageControlDurableObject`\n\nExported from `mcp-usage-control-cloudflare/worker`. Uses SQLite transactions for atomic multi-budget reserve, liability, renewal, settlement, replay protection, and expiry recovery.\n\nSee [Cloudflare adapter](cloudflare.md) for deployment and trust-boundary details.\n\n""",
          )
          insert_before(
              'docs/api-reference.ja.md',
              '## Numeric validation\n',
              """## `mcp-usage-control-cloudflare`\n\n### `CloudflareUsageStore`\n\nDurable Object namespaceを使うWorker-local `UsageStore`。optionは `domainName`、`cleanupBatchSize`、`idempotencyTtlMs`、`observer`。1 `domainName` が1 atomic transaction domainです。\n\n### `RemoteCloudflareUsageStore`\n\nCloudflare外のapplication向けHTTP `UsageStore`。`endpoint` は必須で、local以外はHTTPSのみ許可します。request headerは直接またはcallbackで指定できます。timeout / network failureは `CloudflareUsageTransportError` として表面化し、自動retryしません。\n\n### `createCloudflareUsageStoreGateway()`\n\nremote store向けWorker HTTP handlerを作成します。application-defined `authorize(request)` callbackが必須です。gatewayはadapterが生成するhashed accounting protocolだけを受け取り、raw Durable Object exceptionを返しません。\n\n### `UsageControlDurableObject`\n\n`mcp-usage-control-cloudflare/worker` からexportします。SQLite transactionでatomic multi-budget reserve、liability、renewal、settlement、replay protection、expiry recoveryを処理します。\n\n詳細は [Cloudflare adapter](cloudflare.ja.md) を参照してください。\n\n""",
          )

          # Observability.
          insert_before(
              'docs/observability.md',
              '## Vendor adapters\n',
              """## Cloudflare recovery telemetry\n\n`CloudflareUsageStore` / `RemoteCloudflareUsageStore` can emit `reservation.recovered` with `store: 'cloudflare'`. Lazy cleanup emits aggregate counts/units; directly addressed expiry can include only the opaque hashed reservation ID. Raw principal, tenant, tool, operation, budget, and tool-argument values are not persisted by the Cloudflare backend solely for recovery telemetry.\n\n""",
          )
          insert_before(
              'docs/observability.ja.md',
              '## Vendor adapter\n',
              """## Cloudflare recovery telemetry\n\n`CloudflareUsageStore` / `RemoteCloudflareUsageStore` は `store: 'cloudflare'` の `reservation.recovered` を発火できます。lazy cleanupはaggregate count / units、直接指定されたexpiryではopaque hashed reservation IDだけを含められます。recovery telemetryのためだけにraw principal / tenant / tool / operation / budget / tool-argument値をCloudflare backendへ永続化しません。\n\n""",
          )

          # Security.
          insert_before(
              'SECURITY.md',
              '## Redis durability boundary\n',
              """## Cloudflare remote-store boundary\n\nThe Cloudflare adapter's public HTTP gateway requires an application-defined authorization callback; it has no unauthenticated default. Non-local remote clients require HTTPS and embedded URL credentials are rejected. Timeout/lost-ack failures are ambiguous and must not be hidden by blind automatic retries.\n\nThe adapter hashes operation, budget, and settlement-outcome identifiers before the Cloudflare backend boundary and does not send tool arguments. Hashing is not encryption and does not make secret-bearing identifiers safe.\n\n""",
          )
          insert_before(
              'SECURITY.ja.md',
              '## Redis durability boundary\n',
              """## Cloudflare remote-store boundary\n\nCloudflare adapterのpublic HTTP gatewayはapplication-defined authorization callbackを必須とし、unauthenticated defaultを持ちません。local以外のremote clientはHTTPS必須で、URLへ埋め込んだcredentialもrejectします。timeout / lost ACKはambiguousなのでblind automatic retryで隠してはいけません。\n\noperation / budget / settlement-outcome identifierはCloudflare backend boundary前にhash化し、tool argumentsは送りません。hashingはencryptionではなく、secretを含むidentifierを安全にするものではありません。\n\n""",
          )

          # Changelog before first public publish.
          replace_once(
              'CHANGELOG.md',
              '- Aggregate Redis expiry-recovery observability without persisting raw request identities solely for telemetry.\n',
              '- Aggregate Redis expiry-recovery observability without persisting raw request identities solely for telemetry.\n- `mcp-usage-control-cloudflare` with SQLite-backed Durable Objects, Worker-local and authenticated remote UsageStore clients, hashed transport identifiers, lazy expiry recovery, and explicit ACK-ambiguity behavior.\n- Real local workerd integration coverage for Cloudflare concurrency, multi-budget atomicity, replay, expiry, renewal, lost acknowledgements, authentication, and observer isolation.\n',
          )
          replace_once(
              'CHANGELOG.ja.md',
              '- telemetryのためだけにraw request identityを永続化せず、Redis expiry recoveryをaggregate通知するobservability。\n',
              '- telemetryのためだけにraw request identityを永続化せず、Redis expiry recoveryをaggregate通知するobservability。\n- SQLite-backed Durable Objects、Worker-local / authenticated remote UsageStore、hashed transport identifier、lazy expiry recovery、明示的ACK ambiguity behaviorを持つ `mcp-usage-control-cloudflare`。\n- Cloudflare concurrency、multi-budget atomicity、replay、expiry、renewal、lost ACK、authentication、observer isolationをlocal workerdで検証するintegration coverage。\n',
          )
          PY
      - name: Commit documentation synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name git-ksk
          git config user.email 108925270+git-ksk@users.noreply.github.com
          git add README.md README.ja.md docs/api-reference.md docs/api-reference.ja.md docs/observability.md docs/observability.ja.md SECURITY.md SECURITY.ja.md CHANGELOG.md CHANGELOG.ja.md
          git commit -m "docs: integrate Cloudflare adapter across public documentation"
          git push origin HEAD:feat/cloudflare-durable-objects
