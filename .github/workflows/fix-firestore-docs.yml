name: Fix Firestore docs consistency

on:
  push:
    branches: [feat/firestore-usage-store]
    paths:
      - '.github/workflows/fix-firestore-docs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/firestore-usage-store
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Update repository docs for the fifth package
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'README.md',
              'Do not expect registry installation of `mcp-usage-control`, `mcp-usage-control-mcp`, `mcp-usage-control-redis`, or `mcp-usage-control-cloudflare` to work yet.',
              'Do not expect registry installation of `mcp-usage-control`, `mcp-usage-control-mcp`, `mcp-usage-control-redis`, `mcp-usage-control-cloudflare`, or `mcp-usage-control-firestore` to work yet.',
          )
          replace_once(
              'README.md',
              '- **`mcp-usage-control-cloudflare`** — Cloudflare Durable Objects + SQLite store with Worker-local and authenticated remote-client paths.\n\nAll four packages are ESM and require Node.js 20+.',
              '- **`mcp-usage-control-cloudflare`** — Cloudflare Durable Objects + SQLite store with Worker-local and authenticated remote-client paths.\n- **`mcp-usage-control-firestore`** — server-side Firestore transactional store with multi-budget admission, expiry recovery, and Firestore-specific contention guidance.\n\nAll five packages are ESM and require Node.js 20+.',
          )
          replace_once(
              'README.md',
              '- [Cloudflare adapter](docs/cloudflare.md)\n- [Roadmap](docs/roadmap.md)',
              '- [Cloudflare adapter](docs/cloudflare.md)\n- [Firestore adapter](docs/firestore.md)\n- [Roadmap](docs/roadmap.md)',
          )

          replace_once(
              'README.ja.md',
              '現時点では `mcp-usage-control` / `mcp-usage-control-mcp` / `mcp-usage-control-redis` / `mcp-usage-control-cloudflare` をregistryからinstallできる前提にはしていません。',
              '現時点では `mcp-usage-control` / `mcp-usage-control-mcp` / `mcp-usage-control-redis` / `mcp-usage-control-cloudflare` / `mcp-usage-control-firestore` をregistryからinstallできる前提にはしていません。',
          )
          replace_once(
              'README.ja.md',
              '- **`mcp-usage-control-cloudflare`** — Cloudflare Durable Objects + SQLite store。Worker-localとauthenticated remote-client pathを提供。\n\n4 packageともESM / Node.js 20+です。',
              '- **`mcp-usage-control-cloudflare`** — Cloudflare Durable Objects + SQLite store。Worker-localとauthenticated remote-client pathを提供。\n- **`mcp-usage-control-firestore`** — server-side Firestore transactionを使うstore。multi-budget admission、expiry recovery、Firestore固有のcontention guidanceを提供。\n\n5 packageともESM / Node.js 20+です。',
          )
          replace_once(
              'README.ja.md',
              '- [Cloudflare adapter](docs/cloudflare.ja.md)\n- [Roadmap](docs/roadmap.ja.md)',
              '- [Cloudflare adapter](docs/cloudflare.ja.md)\n- [Firestore adapter](docs/firestore.ja.md)\n- [Roadmap](docs/roadmap.ja.md)',
          )

          replace_once('docs/using-from-source.md', '## 2. Pack the four packages locally', '## 2. Pack the five packages locally')
          replace_once(
              'docs/using-from-source.md',
              'pnpm --dir packages/cloudflare pack --pack-destination "$PWD/.packs"',
              'pnpm --dir packages/cloudflare pack --pack-destination "$PWD/.packs"\npnpm --dir packages/firestore pack --pack-destination "$PWD/.packs"',
          )
          replace_once(
              'docs/using-from-source.md',
              'This produces:\n\n```text\n.packs/mcp-usage-control-0.1.0.tgz\n.packs/mcp-usage-control-mcp-0.1.0.tgz\n.packs/mcp-usage-control-redis-0.1.0.tgz\n.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n```',
              'This produces:\n\n```text\n.packs/mcp-usage-control-0.1.0.tgz\n.packs/mcp-usage-control-mcp-0.1.0.tgz\n.packs/mcp-usage-control-redis-0.1.0.tgz\n.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n.packs/mcp-usage-control-firestore-0.1.0.tgz\n```',
          )
          replace_once(
              'docs/using-from-source.md',
              'Core + Cloudflare adapter:\n\n```console\nnpm install \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n```\n\nAll four:',
              'Core + Cloudflare adapter:\n\n```console\nnpm install \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n```\n\nCore + Firestore adapter (choose a server Firestore client for actual use):\n\n```console\nnpm install \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-firestore-0.1.0.tgz \\\n  firebase-admin\n```\n\n`@google-cloud/firestore` can be used instead of `firebase-admin`. The adapter intentionally does not bundle either client as a runtime dependency.\n\nAll five:',
          )
          replace_once(
              'docs/using-from-source.md',
              '  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz \\\n  @modelcontextprotocol/server@2.0.0',
              '  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-firestore-0.1.0.tgz \\\n  @modelcontextprotocol/server@2.0.0',
          )
          replace_once(
              'docs/using-from-source.md',
              "import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';\n\nif (![MemoryUsageStore, UsageControl, protectTool, RedisUsageStore, CloudflareUsageStore, RemoteCloudflareUsageStore].every(Boolean)) {",
              "import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';\nimport { FirestoreUsageStore } from 'mcp-usage-control-firestore';\n\nif (![MemoryUsageStore, UsageControl, protectTool, RedisUsageStore, CloudflareUsageStore, RemoteCloudflareUsageStore, FirestoreUsageStore].every(Boolean)) {",
          )
          replace_once(
              'docs/using-from-source.md',
              'Use the Redis adapter or the dedicated Cloudflare workerd integration workflow for distributed-enforcement verification.',
              'Use the Redis adapter, the dedicated Cloudflare workerd integration workflow, or the Firestore Emulator integration workflow for distributed-enforcement verification.',
          )

          replace_once('docs/using-from-source.ja.md', '## 2. 4 packageをローカルpack', '## 2. 5 packageをローカルpack')
          replace_once(
              'docs/using-from-source.ja.md',
              'pnpm --dir packages/cloudflare pack --pack-destination "$PWD/.packs"',
              'pnpm --dir packages/cloudflare pack --pack-destination "$PWD/.packs"\npnpm --dir packages/firestore pack --pack-destination "$PWD/.packs"',
          )
          replace_once(
              'docs/using-from-source.ja.md',
              '次のtarballが生成されます。\n\n```text\n.packs/mcp-usage-control-0.1.0.tgz\n.packs/mcp-usage-control-mcp-0.1.0.tgz\n.packs/mcp-usage-control-redis-0.1.0.tgz\n.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n```',
              '次のtarballが生成されます。\n\n```text\n.packs/mcp-usage-control-0.1.0.tgz\n.packs/mcp-usage-control-mcp-0.1.0.tgz\n.packs/mcp-usage-control-redis-0.1.0.tgz\n.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n.packs/mcp-usage-control-firestore-0.1.0.tgz\n```',
          )
          replace_once(
              'docs/using-from-source.ja.md',
              'Core + Cloudflare adapter:\n\n```console\nnpm install \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n```\n\n4 packageすべて:',
              'Core + Cloudflare adapter:\n\n```console\nnpm install \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz\n```\n\nCore + Firestore adapter（実利用ではserver-side Firestore clientを1つ選択）:\n\n```console\nnpm install \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-firestore-0.1.0.tgz \\\n  firebase-admin\n```\n\n`firebase-admin` の代わりに `@google-cloud/firestore` も利用できます。adapterはどちらもruntime dependencyとしてbundleしません。\n\n5 packageすべて:',
          )
          replace_once(
              'docs/using-from-source.ja.md',
              '  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz \\\n  @modelcontextprotocol/server@2.0.0',
              '  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-cloudflare-0.1.0.tgz \\\n  /absolute/path/to/mcp-usage-control/.packs/mcp-usage-control-firestore-0.1.0.tgz \\\n  @modelcontextprotocol/server@2.0.0',
          )
          replace_once(
              'docs/using-from-source.ja.md',
              "import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';\n\nif (![MemoryUsageStore, UsageControl, protectTool, RedisUsageStore, CloudflareUsageStore, RemoteCloudflareUsageStore].every(Boolean)) {",
              "import { CloudflareUsageStore, RemoteCloudflareUsageStore } from 'mcp-usage-control-cloudflare';\nimport { FirestoreUsageStore } from 'mcp-usage-control-firestore';\n\nif (![MemoryUsageStore, UsageControl, protectTool, RedisUsageStore, CloudflareUsageStore, RemoteCloudflareUsageStore, FirestoreUsageStore].every(Boolean)) {",
          )
          replace_once(
              'docs/using-from-source.ja.md',
              'distributed enforcementの確認ではRedis adapterまたはCloudflare専用workerd integration workflowを使います。',
              'distributed enforcementの確認ではRedis adapter、Cloudflare専用workerd integration workflow、またはFirestore Emulator integration workflowを使います。',
          )
          PY
      - name: Commit documentation fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-firestore-docs.yml
          git config user.name 'git-ksk'
          git config user.email '108925270+git-ksk@users.noreply.github.com'
          git add README.md README.ja.md docs/using-from-source.md docs/using-from-source.ja.md .github/workflows/fix-firestore-docs.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'no documentation changes produced'
            exit 1
          fi
          git commit -m 'docs: add Firestore package to source usage guides'
          git push origin HEAD:feat/firestore-usage-store
