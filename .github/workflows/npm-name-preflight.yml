name: npm name preflight

on:
  push:
    branches: [feat/v0.1-release]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require v0.1 package names to be unregistered
        shell: bash
        run: |
          set -euo pipefail
          for name in mcp-usage-control mcp-usage-control-mcp mcp-usage-control-redis; do
            if npm view "$name" name --json >/dev/null 2>&1; then
              echo "$name is already registered on npm" >&2
              exit 1
            fi
            echo "$name is currently unregistered"
          done
