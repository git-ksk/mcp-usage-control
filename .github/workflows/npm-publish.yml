name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example v0.2.0)
        required: true
        type: string
      confirm:
        description: Explicitly authorize npm publication
        required: true
        default: false
        type: boolean
      verify_only:
        description: Read-only registry verification without npm publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirm == true || inputs.verify_only == true }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm CLI with Trusted Publishing support
        run: npm install --global npm@11.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test scripts/verify-npm-registry.test.mjs

      - name: Download exact GitHub Release package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/muc-packs
          mkdir -p /tmp/muc-packs
          gh release download "$TAG" --dir /tmp/muc-packs \
            --pattern 'mcp-usage-control-*.tgz' \
            --pattern 'SHA256SUMS'
          test "$(find /tmp/muc-packs -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = 5
          (cd /tmp/muc-packs && sha256sum --check SHA256SUMS)

      - name: Verify package versions match tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for dir in packages/core packages/mcp packages/redis packages/cloudflare packages/firestore; do
            actual="$(node -p "require('./${dir}/package.json').version")"
            test "$actual" = "$VERSION"
          done

      - name: Verify exact release package manifests
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            mcp-usage-control
            mcp-usage-control-mcp
            mcp-usage-control-redis
            mcp-usage-control-cloudflare
            mcp-usage-control-firestore
          )
          for name in "${expected[@]}"; do
            archive="/tmp/muc-packs/${name}-${VERSION}.tgz"
            test -f "$archive"
            manifest="$(tar -xOf "$archive" package/package.json)"
            test "$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(p.name)' <<<"$manifest")" = "$name"
            test "$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(p.version)' <<<"$manifest")" = "$VERSION"
            ! grep -q 'workspace:' <<<"$manifest"
            ! grep -q 'pack-workspace-deps' <<<"$manifest"
          done

      - name: Publish packages in dependency order
        if: ${{ inputs.confirm == true && inputs.verify_only != true }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          publish_one() {
            local name="$1"
            local archive="$2"
            if npm view "${name}@${VERSION}" version --json >/dev/null 2>&1; then
              echo "ALREADY PUBLISHED: ${name}@${VERSION}; verifying immutable release artifact before skip"
              node scripts/verify-npm-registry.mjs "$VERSION" /tmp/muc-packs "$name"
              return 0
            fi
            echo "PUBLISH REQUEST: ${name}@${VERSION}"
            if npm publish "$archive" --access public --provenance; then
              echo "PUBLISH ACCEPTED: ${name}@${VERSION}; awaiting registry propagation in verification phase"
              return 0
            fi
            # Some registry acknowledgements are ambiguous: accept only if the
            # exact signed/provenance-bearing release artifact eventually appears.
            # Never blindly re-publish after an uncertain response.
            echo "PUBLISH ACK UNCERTAIN: ${name}@${VERSION}; checking exact immutable version" >&2
            node scripts/verify-npm-registry.mjs "$VERSION" /tmp/muc-packs "$name" || {
              echo "PUBLISH FAILED and exact published artifact could not be verified for ${name}@${VERSION}" >&2
              return 1
            }
          }

          publish_one mcp-usage-control "/tmp/muc-packs/mcp-usage-control-${VERSION}.tgz"
          publish_one mcp-usage-control-mcp "/tmp/muc-packs/mcp-usage-control-mcp-${VERSION}.tgz"
          publish_one mcp-usage-control-redis "/tmp/muc-packs/mcp-usage-control-redis-${VERSION}.tgz"
          publish_one mcp-usage-control-cloudflare "/tmp/muc-packs/mcp-usage-control-cloudflare-${VERSION}.tgz"
          publish_one mcp-usage-control-firestore "/tmp/muc-packs/mcp-usage-control-firestore-${VERSION}.tgz"

      - name: Verify registry propagation, exact immutable artifacts and provenance metadata
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Up to 15 minutes, without npm CLI cached metadata. Published bytes,
          # dist integrity, exact name/version, latest tags and provenance are
          # all mandatory; a missing version eventually fails, never silently passes.
          node scripts/verify-npm-registry.mjs "$VERSION" /tmp/muc-packs

      - name: Independently verify npm registry signatures and provenance
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Fresh scratch consumer; never install from a mutable workspace or
          # execute third-party lifecycle scripts. npm validates registry-backed
          # signatures/attestations independently of the metadata/byte check.
          mkdir -p /tmp/muc-registry-audit
          printf '{"name":"muc-registry-audit","version":"1.0.0","private":true}\n' > /tmp/muc-registry-audit/package.json
          cd /tmp/muc-registry-audit
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            "mcp-usage-control@${VERSION}" \
            "mcp-usage-control-mcp@${VERSION}" \
            "mcp-usage-control-redis@${VERSION}" \
            "mcp-usage-control-cloudflare@${VERSION}" \
            "mcp-usage-control-firestore@${VERSION}"
          npm audit signatures --json > /tmp/muc-registry-signatures.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("/tmp/muc-registry-signatures.json", "utf8"));
            if (result.invalid?.length || result.missing?.length) {
              throw new Error("npm registry signature/provenance verification was incomplete or invalid");
            }
            console.log("npm registry signatures/provenance: verified");
          '
