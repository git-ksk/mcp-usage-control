name: Firestore Observer Type Fix

on:
  push:
    branches:
      - feat/firestore-usage-store
    paths:
      - '.github/workflows/firestore-observer-type-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/firestore-usage-store
      - name: Apply exact-optional field fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/firestore/src/index.ts')
          source = path.read_text()
          old = '  private readonly observer?: FirestoreRecoveryObserver;'
          new = '  private readonly observer: FirestoreRecoveryObserver | undefined;'
          if source.count(old) != 1:
              raise SystemExit('observer field pattern mismatch')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/firestore/src/index.ts
          git rm .github/workflows/firestore-observer-type-fix.yml
          git commit -m 'fix: type Firestore recovery observer field explicitly'
          git push origin HEAD:feat/firestore-usage-store
