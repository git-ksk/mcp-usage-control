name: Fix Firestore documentation index

on:
  push:
    branches:
      - feat/firestore-usage-store
    paths:
      - '.github/workflows/fix-firestore-doc-index.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/firestore-usage-store
      - name: Apply documentation updates
        run: python3 .github/scripts/fix_firestore_public_docs.py
      - name: Commit documentation updates
        run: |
          rm .github/workflows/fix-firestore-doc-index.yml
          rm .github/scripts/fix_firestore_public_docs.py
          git config user.name 'git-ksk'
          git config user.email '108925270+git-ksk@users.noreply.github.com'
          git add CHANGELOG.md CHANGELOG.ja.md docs/README.md docs/README.ja.md docs/api-reference.md docs/api-reference.ja.md .github/workflows/fix-firestore-doc-index.yml .github/scripts/fix_firestore_public_docs.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'no documentation changes produced'
            exit 1
          fi
          git commit -m 'docs: complete Firestore public documentation surface'
          git push origin HEAD:feat/firestore-usage-store
