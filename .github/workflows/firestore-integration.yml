name: Firestore Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_integration: ${{ steps.scope.outputs.run_integration }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Detect Firestore-relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; running Firestore integration conservatively."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")
          run_integration=false
          for path in "${changed[@]}"; do
            case "$path" in
              packages/firestore/*|packages/firestore/**|packages/core/*|packages/core/**|packages/mcp/*|packages/mcp/**|.github/workflows/firestore-integration.yml)
                run_integration=true
                break
                ;;
            esac
          done
          echo "run_integration=$run_integration" >> "$GITHUB_OUTPUT"

  emulator:
    needs: changes
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: demo-muc-firestore
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mcp-usage-control build
      - run: pnpm --filter mcp-usage-control-mcp build
      - run: pnpm --filter mcp-usage-control-firestore build
      - name: Type-check server Firestore client compatibility
        shell: bash
        run: |
          set -euo pipefail
          compat_file='packages/firestore/client-compat.mts'
          trap 'rm -f "$compat_file"' EXIT
          cat > "$compat_file" <<'TS'
          import type { Firestore } from '@google-cloud/firestore';
          import { FirestoreUsageStore } from './dist/index.js';

          declare const firestore: Firestore;
          new FirestoreUsageStore(firestore);
          TS
          pnpm exec tsc \
            --noEmit \
            --strict \
            --skipLibCheck \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --types node \
            "$compat_file"
      - name: Prepare packed Firestore candidate external consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/muc-fs-candidate /tmp/muc-fs-consumer
          for dir in core mcp firestore; do
            (cd "packages/$dir" && npm pack --pack-destination /tmp/muc-fs-candidate >/dev/null)
          done
          cd /tmp/muc-fs-consumer
          npm init -y >/dev/null
          npm install --ignore-scripts \
            /tmp/muc-fs-candidate/mcp-usage-control-*.tgz \
            @google-cloud/firestore@8.7.0 \
            @modelcontextprotocol/client@2.3.1 \
            @modelcontextprotocol/server@2.3.1 \
            zod@^4.0.0
          cp "$GITHUB_WORKSPACE/packages/firestore/test/mcp-sdk-e2e.mjs" ./firestore-sdk-e2e.mjs

      - name: Run Firestore adapter against Local Emulator Suite
        shell: bash
        run: >-
          pnpm dlx firebase-tools@15.24.0
          emulators:exec
          --only firestore
          --project demo-muc-firestore
          "pnpm --filter mcp-usage-control-firestore test:emulator && node examples/mcp-durable-multi-round/run.mjs firestore"

  firestore-safety:
    name: firestore-safety
    if: always()
    needs: [changes, emulator]
    runs-on: ubuntu-latest
    steps:
      - name: Require integration when applicable
        env:
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$RUN_INTEGRATION" == "true" ]]; then
            test "$EMULATOR_RESULT" = "success"
          else
            test "$EMULATOR_RESULT" = "skipped"
          fi
